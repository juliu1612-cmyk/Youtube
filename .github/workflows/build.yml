name: Build Installers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (x86_64 via Rosetta)
        run: |
          arch -x86_64 python -m pip install --upgrade pip
          arch -x86_64 pip install yt-dlp pywebview pyinstaller

      - name: Build macOS .app (Intel x86_64)
        run: |
          arch -x86_64 pyinstaller YouTubeDownloader_Mac.spec --noconfirm --clean

      - name: Create .dmg
        run: |
          mkdir -p dmg-stage
          cp -R dist/YouTubeDownloader.app dmg-stage/
          ln -s /Applications dmg-stage/Applications
          hdiutil create -volname "YouTube Downloader" -srcfolder dmg-stage -ov -format UDZO YouTubeDownloader-macOS.dmg

      - name: Upload macOS .dmg
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-macOS-dmg
          path: YouTubeDownloader-macOS.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp pywebview pyinstaller pythonnet

      - name: Build Windows .exe
        run: |
          pyinstaller YouTubeDownloader_Windows.spec --noconfirm --clean

      - name: Download Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress

      - name: Create Windows installer
        shell: pwsh
        run: |
          # Get absolute path of dist folder
          $distPath = (Resolve-Path "dist/YouTubeDownloader").Path
          $issPath = (Resolve-Path "installer.iss").Path

          # Replace placeholder in iss file
          $content = Get-Content $issPath -Raw
          $content = $content -replace '{{DIST_PATH}}', $distPath
          $tempIss = "installer_resolved.iss"
          Set-Content -Path $tempIss -Value $content -Encoding UTF8

          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" $tempIss

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: YouTubeDownloader-Windows-exe
          path: installer_output/YouTubeDownloader-Setup.exe
